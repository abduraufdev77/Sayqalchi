name: Android
on:
  push:
    branches: [main]
    paths: ['android/**', 'shared/**', 'scripts/package-android.py', 'scripts/audit-secrets.py', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'shared/**', 'scripts/package-android.py', 'scripts/audit-secrets.py', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests, lint and APK compilation
        run: |
          python3 scripts/audit-secrets.py
          android/gradlew -p android :core:test :app:lintDebug :app:assembleDebug :fixture:assembleDebug
      - name: Enable KVM for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cross-app popup and replacement checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            python3 android/tests/fixture_server.py > /tmp/sayqalchi-fixture.log 2>&1 &
            android/gradlew -p android :fixture:installDebug :app:connectedDebugAndroidTest
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-checks
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
