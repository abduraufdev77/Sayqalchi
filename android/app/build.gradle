plugins { id 'com.android.application' }
android {
    namespace 'uz.sayqalchi.android'
    compileSdk 36
    defaultConfig {
        applicationId 'uz.sayqalchi.android'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.6.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('SAYQALCHI_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('SAYQALCHI_ANDROID_KEYSTORE'))
                storePassword System.getenv('SAYQALCHI_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('SAYQALCHI_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('SAYQALCHI_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { animationsDisabled true }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/versions/**'] } }
}
dependencies {
    implementation project(':core')
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
